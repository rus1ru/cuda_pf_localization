name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cpu-tests:
    # Full test suite on CPU backend — no GPU runner needed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build (CPU feature set)
        run: cargo build --release -p pf_core

      - name: Tests
        run: cargo test --release -p pf_core

      - name: Clippy (non-blocking)
        run: cargo clippy --release -p pf_core -- -W clippy::all

  cuda-build:
    # Compile the CUDA kernels and verify the FFI links.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Jimver/cuda-toolkit@v0.2.21
        id: cuda
        with:
          cuda: "12.5.0"
          method: network

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build kernels
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"
          test -f build/libpf_kernels.so

      - name: Build + link CUDA-backed bench
        run: |
          export LD_LIBRARY_PATH="$PWD/build:$LD_LIBRARY_PATH"
          cargo build --release -p pf-bench

      - name: Tests (CUDA feature set; GPU tests self-skip without a device)
        run: |
          export LD_LIBRARY_PATH="$PWD/build:$LD_LIBRARY_PATH"
          cargo test --release -p pf_core --features cuda

      - name: Smoke-run (1k particles, GPU)
        run: |
          export LD_LIBRARY_PATH="$PWD/build:$LD_LIBRARY_PATH"
          ./target/release/pf-bench 2>&1 | head -8 || true
