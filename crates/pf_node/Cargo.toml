[package]
name = "pf_node"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "ROS 2 node for CUDA-accelerated 3D Monte Carlo localization from point landmarks"

[dependencies]
pf_core = { path = "../pf_core" }
rclrs = "0.11"
builtin_interfaces = "*"
geometry_msgs = "*"
sensor_msgs = "*"
nav_msgs = "*"
std_srvs = "*"
tf2_msgs = "*"
visualization_msgs = "*"

[[bin]]
name = "pf_node"
path = "src/pf_node.rs"

[[bin]]
name = "landmark_sim_demo"
path = "src/landmark_sim_demo.rs"
